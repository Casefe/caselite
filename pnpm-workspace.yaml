packages:
  - apps/desktop
  - packages/*

# pnpm 11 reads this setting from YAML; .npmrc retains the Forge convention.
nodeLinker: hoisted
saveExact: true
strictDepBuilds: true

allowBuilds:
  electron: true
  better-sqlite3: true
  esbuild: true
  '@google/genai': false
  protobufjs: false

patchedDependencies:
  yjs@13.6.33: patches/yjs@13.6.33.patch
